# =============================================================================
#  UK ISA Command Centre — configuration
#  Policy thresholds (caps, upside, OCF…) live in handbook.md §0, NOT here.
#  This file holds: accounts, watchlist, target weights, per-ticker alerts, UI/cache settings.
# =============================================================================

profile:
  monthly_contribution_gbp: 1000      # default for the Buy Plan box in Pane 1
  fractional_shares: true             # false => whole-share orders (e.g. some HL funds / ETFs)
  min_order_gbp: 25                   # drop buy lines smaller than this and re-allocate

data:
  holdings_csv: data/holdings.csv
  contributions_csv: data/contributions.csv
  handbook: handbook.md
  cache_dir: .cache
  reports_dir: reports

# --- Accounts (ids are referenced from the two CSVs) -------------------------
# kind: SS_ISA | CASH_ISA | IFISA | LISA | GIA
# flexible: only meaningful for ISAs. VERIFY with each provider's T&Cs — not every ISA is flexible.
accounts:
  - {id: T212_ISA, broker: "Trading 212",           kind: SS_ISA, flexible: true}
  - {id: HL_ISA,   broker: "Hargreaves Lansdown",   kind: SS_ISA, flexible: true}
  - {id: VG_ISA,   broker: "Vanguard UK",           kind: SS_ISA, flexible: true}
  - {id: HL_LISA,  broker: "Hargreaves Lansdown",   kind: LISA,   flexible: false}
  - {id: HL_GIA,   broker: "Hargreaves Lansdown",   kind: GIA,    flexible: false}

cgt:
  realised_gains_ytd_gbp: 420         # gains already realised this tax year outside the ISA

# --- Market tape (top bar) ---------------------------------------------------
tape:
  - {symbol: "^FTSE",    label: "FTSE 100", kind: index}
  - {symbol: "^GSPC",    label: "S&P 500",  kind: index}
  - {symbol: "GBPUSD=X", label: "GBP/USD",  kind: fx}
  # UK 10Y gilt yield comes from the Bank of England IADB (series IUDMNPY, no key needed)

# --- UI ----------------------------------------------------------------------
ui:
  refresh_seconds: 60                 # auto-refresh period (press `a` to toggle)
  tape_scroll_hz: 6
  experience_level: advanced          # beginner | intermediate | advanced   (press `l`, or click the badge, to change)

cache_ttl_seconds:
  quote: 90
  fx: 90
  history: 21600                      # 6h  (daily bars)
  info: 43200                         # 12h (fundamentals + analyst data)
  news: 900
  gilt: 3600

# --- Default alert thresholds (per-ticker `alerts:` override these) ----------
alerts:
  rsi_below: 30
  rsi_above: 70

# --- Watchlist & target weights ----------------------------------------------
# 20-ticker UK ISA universe, tagged by `sleeve` (the category pills in pane 2):
#   core_etf = Global & Regional Core ETFs | uk_div = UK Blue-Chips & Dividend Income
#   trust    = UK Investment Trusts        | global_stock = Global Quality & Growth
# target_weight_pct: share of TOTAL ISA value incl. the cash sleeve. Must sum to 100 with `cash_target_pct`.
#   Only the six holdings in your sample portfolio carry targets; the rest are watch-only (0%): screened and charted,
#   never funded by the buy plan until you give them a target.
# ter_pct: ongoing charge (OCF) — APPROXIMATE, verify against each fund's latest KID.
# distribution: acc (accumulating) or dist.  yield_override_pct: used for acc funds (Yahoo shows 0% cash yield).
# look_through: approximate GICS sector weights (Yahoo sector names), normalised at runtime. REFRESH QUARTERLY.
# aliases: extra company names used only to tag news headlines to a ticker.
# ISINs are included only where certain; verify before relying on them for broker imports.
cash_target_pct: 5

